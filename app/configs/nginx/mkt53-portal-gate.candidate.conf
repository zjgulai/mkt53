# P0-05 candidate only. Do not install without a separate production-write authorization.
# Expected current production mkt block SHA-256:
# 4f78ab917e7c61508d374da5b318f4d49ce2de7da9f9142c76714b4eb9206342
server {
    listen 443 ssl;
    http2 on;
    server_name mkt.lute-tlz-dddd.top;

    ssl_certificate /etc/letsencrypt/live/lute-tlz-dddd.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lute-tlz-dddd.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/mkt53;
    index index.html;

    location = /_portal_auth {
        internal;
        auth_request off;
        proxy_pass http://portal_auth/portal/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }

    location / {
        auth_request /_portal_auth;
        error_page 401 =302 https://lute-tlz-dddd.top/login.html?next=$scheme://$host$request_uri;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "private, no-store" always;
    }
}
