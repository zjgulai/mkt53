name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate release candidate evidence
        run: npm run quality:release-evidence
        env:
          MKT53_E2E_PORT: 3030
          MKT53_E2E_REUSE_EXISTING: 0

      - name: Upload release candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mkt53-release-evidence
          path: app/tmp/release-evidence/latest.json
          if-no-files-found: error
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.11"
          python-version: "3.12.13"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync frozen backend dependencies
        run: uv sync --frozen

      - name: Run BE-07 backend quality gate
        run: ./scripts/quality-be07.sh

      - name: Upload BE-07 recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mkt53-backend-be07-evidence
          path: |
            tmp/backend-recovery/be07/**/report.json
            tmp/backend-recovery/be07/**/cleanup.json
          if-no-files-found: warn
          retention-days: 14
